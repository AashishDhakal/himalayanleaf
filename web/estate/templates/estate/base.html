{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Himalayan Leaf · Grand Cru Tea from Nepal{% endblock %}</title>
  <meta name="description" content="{% block description %}Four orthodox single-origin lots from Ilam, eastern Nepal, hand-plucked between 1,400 and 2,100 metres. Offered to importers, tea houses and private-label houses by the chest.{% endblock %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'estate/css/himalayan.css' %}">

  {# himalayan.js registers Alpine components, so it must run before Alpine boots. #}
  <script defer src="{% static 'estate/js/himalayan.js' %}"></script>
  <script defer src="{% static 'estate/vendor/alpine.min.js' %}"></script>
  <script defer src="{% static 'estate/vendor/htmx.min.js' %}"></script>
</head>
<body x-data="hlAmbience" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
{% block body %}{% endblock %}
</body>
</html>
