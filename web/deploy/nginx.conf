# /etc/nginx/sites-available/dev.himalayanleaf.co
#
# certbot rewrites the TLS block below when it issues the certificate; run it
# once against this file as-is (see deploy/README.md).

upstream himalayanleaf {
    server unix:/run/himalayanleaf/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.himalayanleaf.co;

    # Leave this reachable over plain HTTP so certbot can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.himalayanleaf.co;

    ssl_certificate     /etc/letsencrypt/live/dev.himalayanleaf.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.himalayanleaf.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # This is a staging site — keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;   # room for estate photography uploads in the admin
    charset utf-8;

    # collectstatic writes hashed filenames, so these are safe to cache hard.
    location /static/ {
        alias /srv/himalayanleaf/web/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/lib/himalayanleaf/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://himalayanleaf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django reads this to know the request arrived over TLS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }
}
